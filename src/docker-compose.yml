name: tiklabchallenge

services:
  tiklabchallenge.api:
    image: ${DOCKER_REGISTRY-}tiklabchallengeapi
    build:
      context: .
      dockerfile: TiklabChallenge.API/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=none
      - OTEL_RESOURCE_ATTRIBUTES=service.name=tiklabchallenge-api,service.version=1.0.0
      - OTEL_METRIC_EXPORT_INTERVAL=5000
      - Logging__LogLevel__Default=Warning
      - Logging__LogLevel__Microsoft=Warning
      - Logging__LogLevel__Microsoft__AspNetCore=Warning
      - Logging__LogLevel__Microsoft__EntityFrameworkCore=Warning
      - DOTNET_gcServer=1
      - DOTNET_ReadyToRun=0
      - DOTNET_TieredPGO=1
    networks:
      - productnetwork
    restart: on-failure

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ticklab-challenge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - productnetwork

  redis:
    image: redis
    ports:
      - "6379:6379"
    networks:
      - productnetwork
    restart: on-failure

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.3
    environment: 
     DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
    networks:
      - productnetwork
  prometheus:
    image: prom/prometheus
    ports: 
    - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - productnetwork

  grafana:
    image: grafana/grafana
    ports: 
    - "3000:3000"
    networks:
      - productnetwork

networks: 
  productnetwork:

volumes:
  pgdata:
    name: tiklabchallenge_pgdata
